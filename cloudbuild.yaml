# Cloud Build pipeline for deploying this Django container to Cloud Run.
#
# Required Cloud Build service account permissions:
# - Artifact Registry Administrator
# - Cloud Run Admin
# - Service Account User

substitutions:
  _REGION: us-east1
  _SERVICE_NAME: django-devops-app
  _AR_REPO: cloud-run-source-deploy

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Ensure Artifact Registry repository exists
    entrypoint: bash
    args:
      - -c
      - |
        gcloud artifacts repositories describe "${_AR_REPO}" \
          --location="${_REGION}" \
        || gcloud artifacts repositories create "${_AR_REPO}" \
          --repository-format=docker \
          --location="${_REGION}" \
          --description="Docker images for Cloud Run deployments"

  - name: gcr.io/cloud-builders/docker
    id: Build image
    args:
      - build
      - -f
      - dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: Push commit image
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${SHORT_SHA}

  - name: gcr.io/cloud-builders/docker
    id: Push latest image
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Deploy to Cloud Run
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --port=8000
      - --allow-unauthenticated

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:latest

options:
  logging: CLOUD_LOGGING_ONLY
